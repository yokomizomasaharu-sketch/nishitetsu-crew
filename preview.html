<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow">
<title>確認用プレビュー（390×844）</title>

.frame{width:390px;height:844px;background:#0e1319;box-shadow:0 0 0 1px #444,0 10px 40px rgba(0,0,0,.5);overflow:hidden}

<body><div class="frame"><iframe id="f" src="index.html?pv=38"></iframe></div>
